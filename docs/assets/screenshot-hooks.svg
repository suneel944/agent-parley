<svg xmlns="http://www.w3.org/2000/svg" width="1067" height="480" viewBox="0 0 1067 480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<rect width="1067" height="480" rx="10" fill="#0d1117"/>
<rect width="1067" height="30" rx="10" fill="#161b22"/>
<rect y="20" width="1067" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
<text x="533.5" y="19" text-anchor="middle" fill="#8b949e" font-size="12">native hooks · enforcement and delivery</text>
<text x="18.0" y="48.0" xml:space="preserve" fill="#c9d1d9"># a branch switch attempted inside an assigned lane</text>
<text x="18.0" y="66.0" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="84.0" xml:space="preserve"><tspan fill="#d2a8ff">claude-1 </tspan><tspan fill="#e6edf3">PreToolUse Bash: git switch -c hotfix</tspan></text>
<text x="18.0" y="102.0" xml:space="preserve" fill="#c9d1d9">{</text>
<text x="18.0" y="120.0" xml:space="preserve" fill="#c9d1d9">  "hookSpecificOutput": {</text>
<text x="18.0" y="138.0" xml:space="preserve" fill="#c9d1d9">    "hookEventName": "PreToolUse",</text>
<text x="18.0" y="156.0" xml:space="preserve" fill="#ff7b72">    "permissionDecision": "deny",</text>
<text x="18.0" y="174.0" xml:space="preserve" fill="#ff7b72">    "permissionDecisionReason": "Agent Parley owns this worktree on 'parley/dd35da341c7690c7/lane-1'; branch switches are blocked. C</text>
<text x="18.0" y="192.0" xml:space="preserve" fill="#c9d1d9">reate or use a separate worktree for feature branches."</text>
<text x="18.0" y="210.0" xml:space="preserve" fill="#c9d1d9">  }</text>
<text x="18.0" y="228.0" xml:space="preserve" fill="#c9d1d9">}</text>
<text x="18.0" y="246.0" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="264.0" xml:space="preserve" fill="#c9d1d9"># the same lane after any bypass leaves it on another branch</text>
<text x="18.0" y="282.0" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="300.0" xml:space="preserve"><tspan fill="#d2a8ff">codex-1 </tspan><tspan fill="#e6edf3">PreToolUse Bash: cat src/payments/refund.py</tspan></text>
<text x="18.0" y="318.0" xml:space="preserve" fill="#c9d1d9">{</text>
<text x="18.0" y="336.0" xml:space="preserve" fill="#c9d1d9">  "hookSpecificOutput": {</text>
<text x="18.0" y="354.0" xml:space="preserve" fill="#c9d1d9">    "hookEventName": "PreToolUse",</text>
<text x="18.0" y="372.0" xml:space="preserve" fill="#ff7b72">    "permissionDecision": "deny",</text>
<text x="18.0" y="390.0" xml:space="preserve" fill="#c9d1d9">    "permissionDecisionReason": "Agent Parley lane is on 'refund-spike', expected 'parley/dd35da341c7690c7/lane-2'. Restore it with </text>
<text x="18.0" y="408.0" xml:space="preserve" fill="#c9d1d9">`git switch parley/dd35da341c7690c7/lane-2` before continuing; committed and uncommitted work must be preserved."</text>
<text x="18.0" y="426.0" xml:space="preserve" fill="#c9d1d9">  }</text>
<text x="18.0" y="444.0" xml:space="preserve" fill="#c9d1d9">}</text>
</svg>
