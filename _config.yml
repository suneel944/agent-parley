  in its own Git worktree, with shared issue ownership, advisory reservations
  and explicit handoffs.
url: https://suneel944.github.io
baseurl: /agent-parley
theme: jekyll-theme-primer
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
