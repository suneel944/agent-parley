name: Prepare release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(main): release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a package change since the approved release
        id: candidate
        run: python3 -m scripts.release_publish candidate
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        if: steps.candidate.outputs.eligible == 'true'
        id: app
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        if: steps.candidate.outputs.eligible == 'true'
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          skip-github-release: true
      - name: Assign release ownership required by the hygiene gate
        if: steps.candidate.outputs.eligible == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const repo = context.repo;
            const open = await github.paginate(
              github.rest.pulls.list, {...repo, state: 'open'});
            const pending = open.filter(candidate =>
              candidate.labels.some(l => l.name === 'autorelease: pending'));
            for (const pr of pending) {
              const version = pr.title.match(/\b\d+\.\d+\.\d+\b/)[0];
              const title = `v${version}`;
              const milestones = await github.paginate(
                github.rest.issues.listMilestones, {...repo, state: 'all'});
              const existing = milestones.find(m => m.title === title);
              const milestone = existing
                ? (existing.state === 'closed'
                  ? (await github.rest.issues.updateMilestone({...repo,
                    milestone_number: existing.number, state: 'open'})).data
                  : existing)
                : (await github.rest.issues.createMilestone(
                  {...repo, title})).data;
              const issues = await github.paginate(
                github.rest.issues.listForRepo,
                {...repo, state: 'all', labels: 'release'});
              const tracked = issues.find(i => !i.pull_request &&
                i.title === `Release ${title}`);
              const issueTitle = `Release ${title}`;
              const issue = tracked ||
                (await github.rest.issues.create({
                  ...repo, title: issueTitle,
                  body: 'Track changelog, version alignment and ' +
                    'verified release artifacts.',
                  assignees: ['suneel944'], labels: ['release'],
                  milestone: milestone.number,
                })).data;
              const current = (await github.rest.pulls.get({
                ...repo, pull_number: pr.number})).data;
              const reference = `Refs #${issue.number}`;
              if (!current.body.includes(reference)) {
                await github.rest.pulls.update({
                  ...repo, pull_number: pr.number,
                  body: `${current.body}\n\n${reference}\n`,
                });
              }
              await github.rest.issues.update({
                ...repo, issue_number: pr.number,
                assignees: ['suneel944'], milestone: milestone.number,
              });
              await github.rest.issues.addLabels({
                ...repo, issue_number: pr.number, labels: ['release'],
              });
            }
