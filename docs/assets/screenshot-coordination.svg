<svg xmlns="http://www.w3.org/2000/svg" width="1164" height="408" viewBox="0 0 1164 408" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
<rect width="1164" height="408" rx="10" fill="#0d1117"/>
<rect width="1164" height="30.0" rx="10" fill="#161b22"/>
<rect y="20.0" width="1164" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
<text x="582" y="19" text-anchor="middle" fill="#8b949e" font-size="12">seven scoped MCP tools</text>
<text x="18.0" y="61.5" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">agent-bridge run codex-1 --task &#x27;Review the refund path&#x27;</tspan></text>
<text x="18.0" y="79.5" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="97.5" xml:space="preserve" fill="#c9d1d9"># the agent reserves the file it is about to change</text>
<text x="18.0" y="115.5" xml:space="preserve" fill="#8b949e">  file_reservation_paths  paths=[&#x27;src/refunds.py&#x27;] exclusive=true ttl_seconds=1800</text>
<text x="18.0" y="133.5" xml:space="preserve" fill="#8b949e">    reason=&#x27;refund rounding fix&#x27;</text>
<text x="18.0" y="151.5" xml:space="preserve" fill="#8b949e">  {&quot;granted&quot;:[{&quot;id&quot;:3,&quot;path&quot;:&quot;src/refunds.py&quot;}],&quot;conflicts&quot;:[]}</text>
<text x="18.0" y="169.5" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="187.5" xml:space="preserve" fill="#c9d1d9"># a second agent asks for the same path and is granted nothing</text>
<text x="18.0" y="205.5" xml:space="preserve" fill="#8b949e">  file_reservation_paths  paths=[&#x27;src/refunds.py&#x27;] exclusive=true ttl_seconds=900</text>
<text x="18.0" y="223.5" xml:space="preserve" fill="#8b949e">    reason=&#x27;shared helper rename&#x27;</text>
<text x="18.0" y="241.5" xml:space="preserve" fill="#8b949e">  {&quot;granted&quot;:[],&quot;conflicts&quot;:[{&quot;path&quot;:&quot;src/refunds.py&quot;,&quot;owner&quot;:&quot;codex-1&quot;,&quot;reason&quot;:&quot;refund rounding fix&quot;}],&quot;has_more&quot;:false}</text>
<text x="18.0" y="259.5" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="277.5" xml:space="preserve" fill="#c9d1d9"># messages are addressed by participant name and retried safely</text>
<text x="18.0" y="295.5" xml:space="preserve" fill="#8b949e">  send_message  to=[&#x27;codex-1&#x27;] idempotency_key=&#x27;demo-1&#x27; ack_required=true</text>
<text x="18.0" y="313.5" xml:space="preserve" fill="#8b949e">  {&quot;id&quot;:1,&quot;duplicate&quot;:true}</text>
<text x="18.0" y="331.5" xml:space="preserve" fill="#c9d1d9"></text>
<text x="18.0" y="349.5" xml:space="preserve" fill="#c9d1d9"># inboxes page incrementally and never mark a message read</text>
<text x="18.0" y="367.5" xml:space="preserve" fill="#8b949e">  fetch_inbox  limit=5</text>
<text x="18.0" y="385.5" xml:space="preserve" fill="#8b949e">  {&quot;messages&quot;:[{&quot;id&quot;:1,&quot;sender&quot;:&quot;claude-1&quot;,&quot;subject&quot;:&quot;Refund path needs a second pass&quot;,&quot;ack_required&quot;:1}],&quot;next_after_id&quot;:1,&quot;has_more&quot;:false}</text>
</svg>
