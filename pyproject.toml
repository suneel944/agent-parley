[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-bridge"
version = "0.3.1"
description = "Run Claude Code and Codex in isolated worktrees with shared coordination."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Suneel Kaushik S", email = "suneel944@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
agent-bridge = "agent_bridge.cli:main"

[project.urls]
Repository = "https://github.com/suneel944/agent-bridge"
Issues = "https://github.com/suneel944/agent-bridge/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_bridge"]

[tool.hatch.build.targets.sdist]
include = ["/agent_bridge", "/plugins", "/tests", "/scripts", "/docs", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/Makefile", "/pyproject.toml", "/uv.lock", "/.claude-plugin", "/.agents"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.14,<1",
    "mcp>=2.1.1,<3",
    "mypy>=2.3.1,<3",
    "pre-commit>=4,<5",
    "httpx>=0.28.1,<1",
    "httpx2>=2.12.0,<3",
]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "ANN001", "ANN201", "ANN202", "PLE", "PLW"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are injected dynamically; descriptive test names are the docs.
"tests/**" = ["D", "ANN001", "ANN201", "ANN202"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["agent_bridge", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
