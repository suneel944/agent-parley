version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [suneel944]
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tools:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    assignees: [suneel944]
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
