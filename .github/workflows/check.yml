name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    needs: python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Python check
        env:
          RESULT: ${{ needs.python.result }}
        run: test "$RESULT" = success
  python:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 20 || 10 }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        os: [ubuntu-latest]
        include:
          - python: '3.12'
            os: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: ${{ matrix.python }}
      - run: make check
  wsl:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364
        with:
          distribution: Ubuntu-24.04
          additional-packages: git python3 curl ca-certificates
      - name: Run the behaviour suite inside the Linux file system
        shell: wsl-bash {0}
        run: |
          set -eu
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cp -r "$PWD" "$HOME/checkout"
          cd "$HOME/checkout"
          uv python install 3.12
          uv sync --locked
          uv build --no-sources
          uv run --locked pytest -q
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/secret-scan
