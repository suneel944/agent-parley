[build-system]
requires = ["hatchling>=1.27,<2", "hatch-fancy-pypi-readme>=25.1,<26"]
build-backend = "hatchling.build"

[project]
name = "agent-parley"
version = "0.18.2"
description = "Run several coding agents in isolated worktrees with shared coordination."
dynamic = ["readme"]
requires-python = ">=3.12"
authors = [{name = "Suneel Kaushik S", email = "suneel944@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "agents",
    "ai-coding-agents",
    "parallel-agents",
    "agent-orchestration",
    "coordination",
    "git-worktree",
    "worktree",
    "claude-code",
    "codex",
    "gemini",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
agent-parley = "agent_parley.entry:main"

[project.urls]
Homepage = "https://suneel944.github.io/agent-parley/"
Documentation = "https://github.com/suneel944/agent-parley/tree/main/docs"
Changelog = "https://github.com/suneel944/agent-parley/blob/main/CHANGELOG.md"
Repository = "https://github.com/suneel944/agent-parley"
Issues = "https://github.com/suneel944/agent-parley/issues"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?m)^https://github\.com/user-attachments/assets/[0-9a-f-]+$'
replacement = '<p align="center"><a href="https://github.com/suneel944/agent-parley#readme"><img src="https://cdn.jsdelivr.net/gh/suneel944/agent-parley@v0.15.1/docs/assets/launch.webp" width="800" alt="The Agent Parley launch video: two lanes claim work in one repository, collide on a reservation, hand off an issue, and agent-parley top shows both lanes. Select to watch it on GitHub."></a></p>'

[tool.hatch.build.targets.wheel]
packages = ["agent_parley"]

[tool.hatch.build.targets.wheel.force-include]
"plugins/agent-parley" = "agent_parley/plugins/agent-parley"

[tool.hatch.build.targets.sdist]
include = ["/agent_parley", "/plugins", "/tests", "/scripts", "/docs", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE", "/SECURITY.md", "/CODE_OF_CONDUCT.md", "/Makefile", "/pyproject.toml", "/uv.lock", "/.claude-plugin", "/.agents", "/.github"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-xdist>=3.6,<4",
    "pyyaml>=6,<7",
    "ruff>=0.14,<1",
    "mcp>=2.1.1,<3",
    "mypy>=2.3.1,<3",
    "pre-commit>=4,<5",
    "httpx>=0.28.1,<1",
    "httpx2>=2.12.0,<3",
]

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D", "ANN001", "ANN201", "ANN202", "PLE", "PLW"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Pytest fixtures are injected dynamically; descriptive test names are the docs.
"tests/**" = ["D", "ANN001", "ANN201", "ANN202"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["agent_parley", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
